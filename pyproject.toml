[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "cachescope"
version = "0.1.0.dev0"
description = "Find which Python functions repeat slow work, and how big a cache they need."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Dulkar Saman V N" }]
keywords = ["cache", "caching", "lru_cache", "performance", "profiler"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Debuggers",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "build", "twine"]

[project.scripts]
cachescope = "cachescope.cli:main"

[project.urls]
Homepage = "https://github.com/dulkarsamanvn/cachescope"
Issues = "https://github.com/dulkarsamanvn/cachescope/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/cachescope"]

[tool.hatch.build.targets.sdist]
include = ["src/cachescope", "tests", "README.md", "LICENSE", "pyproject.toml"]