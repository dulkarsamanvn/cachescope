name: Release to TestPyPI and PyPI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cachescope-release
  cancel-in-progress: false

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  build:
    needs: tests
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.manifest.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install build twine pytest
      - run: python -m pytest -q .github/tests
      - run: python -m build --outdir release-artifacts/dist
      - run: python -m twine check release-artifacts/dist/*
      - id: manifest
        run: python .github/scripts/release_artifacts.py manifest release-artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: cachescope-release
          path: release-artifacts/
          retention-days: 30

  testpypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/cachescope/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cachescope-release
          path: release-artifacts
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: release-artifacts/dist/

  verify-testpypi:
    needs: [build, testpypi]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: cachescope-release
          path: release-artifacts
      - run: python -m pip install pytest
      - run: python .github/scripts/release_artifacts.py install release-artifacts --index testpypi
      - run: python .github/scripts/smoke_release.py
        env:
          EXPECTED_VERSION: ${{ needs.build.outputs.version }}
      - run: python -m pytest -q tests

  pypi:
    needs: [build, verify-testpypi]
    runs-on: ubuntu-latest
    # Configure a required reviewer on this environment before running a release.
    environment:
      name: pypi
      url: https://pypi.org/project/cachescope/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cachescope-release
          path: release-artifacts
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: release-artifacts/dist/

  verify-pypi:
    needs: [build, pypi]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: cachescope-release
          path: release-artifacts
      - run: python -m pip install pytest
      - run: python .github/scripts/release_artifacts.py install release-artifacts --index pypi
      - run: python .github/scripts/smoke_release.py
        env:
          EXPECTED_VERSION: ${{ needs.build.outputs.version }}
      - run: python -m pytest -q tests
